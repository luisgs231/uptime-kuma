# Builds the image and publishes it to the GitHub Container Registry.

name: Publish image

on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install and build the frontend
        run: |
          npm ci
          npm run build
      - name: Validate language files, migrations and package.json
        run: |
          node ./extra/check-lang-json.js
          node ./extra/check-knex-filenames.mjs
          node ./extra/check-package-json.mjs

      - name: Run the added tests
        run: npm run test-added
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out the image name
        id: meta
        run: |
          # ghcr requires a lowercase image name; repository names may not be.
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dockerfile
          target: release
          outputs: type=registry,oci-mediatypes=false
          provenance: false
          sbom: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Delete previous workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs?per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${{ github.run_id }}) | .id" \
            | xargs -r -n1 -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/runs/{}" || true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          DEPLOY_SCRIPT: ${{ secrets.DEPLOY_SCRIPT }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::DEPLOY_URL is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          code=$(curl -sS -o response.txt -w "%{http_code}" \
            -H "Authorization: $DEPLOY_TOKEN" \
            "$DEPLOY_URL?script=$DEPLOY_SCRIPT")
          echo "hook responded HTTP $code"
          echo "--- response ---"
          cat response.txt || true
          echo
          case "$code" in
            2*) echo "deploy accepted" ;;
            *)  echo "::error::deploy hook returned HTTP $code"; exit 1 ;;
          esac
